<title>RMUH Diagram Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root {
  /* Layout: three columns. Left = the step you are on (what to do now). Centre = viewer over the node strip (what drives what).
     Right = the brief and Claude's reasoning (why). One accent; step colours only mark which step a node belongs to. */
  --font: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #EDEFF2; --canvas: #E2E5EA; --surface: #FFFFFF; --surface-2: #F6F7F9; --surface-3: #ECEEF2;
  --line: #DEE1E7; --line-2: #C8CDD6; --fg: #14171C; --fg-2: #535B69; --fg-3: #8A92A0;
  --accent: #2D5BFF; --accent-fg: #fff; --accent-soft: rgba(45, 91, 255, .1); --accent-line: rgba(45, 91, 255, .38);
  --ok: #12915A; --ok-soft: rgba(18, 145, 90, .12); --warn: #B37400; --warn-soft: rgba(214, 150, 0, .14); --err: #CF3535; --err-soft: rgba(207, 53, 53, .11); --todo: #737D8E; --todo-soft: rgba(115, 125, 142, .14);
  --s1: #6B7584; --s2: #7A4FD0; --s3: #D2691E; --s4: #2D5BFF; --s5: #12915A;
  --shadow: 0 1px 2px rgba(18, 22, 30, .05), 0 6px 18px rgba(18, 22, 30, .07);
  --shadow-pop: 0 2px 6px rgba(18, 22, 30, .08), 0 18px 44px rgba(18, 22, 30, .16);
  --paper-shadow: 0 1px 2px rgba(18, 22, 30, .1), 0 10px 30px rgba(18, 22, 30, .12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1114; --canvas: #14161A; --surface: #1A1D22; --surface-2: #202329; --surface-3: #272B32; --line: #2B3038; --line-2: #3B414B; --fg: #ECEEF2; --fg-2: #A6ADB9; --fg-3: #6F7785;
  --accent: #7090FF; --accent-fg: #0A0F1E; --accent-soft: rgba(112, 144, 255, .15); --accent-line: rgba(112, 144, 255, .5);
  --ok: #3CC487; --ok-soft: rgba(60, 196, 135, .14); --warn: #E8AA3A; --warn-soft: rgba(232, 170, 58, .15); --err: #F06767; --err-soft: rgba(240, 103, 103, .15); --todo: #8C95A5; --todo-soft: rgba(140, 149, 165, .16);
  --s1: #98A1AF; --s2: #9A82FF; --s3: #EE9A4E; --s4: #7090FF; --s5: #3CC487;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 22px 50px rgba(0,0,0,.55); --paper-shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1114; --canvas: #14161A; --surface: #1A1D22; --surface-2: #202329; --surface-3: #272B32; --line: #2B3038; --line-2: #3B414B; --fg: #ECEEF2; --fg-2: #A6ADB9; --fg-3: #6F7785;
  --accent: #7090FF; --accent-fg: #0A0F1E; --accent-soft: rgba(112, 144, 255, .15); --accent-line: rgba(112, 144, 255, .5);
  --ok: #3CC487; --ok-soft: rgba(60, 196, 135, .14); --warn: #E8AA3A; --warn-soft: rgba(232, 170, 58, .15); --err: #F06767; --err-soft: rgba(240, 103, 103, .15); --todo: #8C95A5; --todo-soft: rgba(140, 149, 165, .16);
  --s1: #98A1AF; --s2: #9A82FF; --s3: #EE9A4E; --s4: #7090FF; --s5: #3CC487;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 22px 50px rgba(0,0,0,.55); --paper-shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--fg-2); } .faint { color: var(--fg-3); }
.dg { font-family: var(--font); fill: #111; } .dg-zh { font-family: var(--font); }
svg.dg-svg { display: block; width: 100%; height: 100%; background: #fff; }
svg.i { width: 16px; height: 16px; flex: none; }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); }

.app { height: 100%; display: grid; grid-template-rows: 56px 1fr; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-l, .top-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.top-r { justify-content: flex-end; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.brand .mark { width: 24px; height: 24px; border-radius: 6px; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.proj { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps { display: flex; gap: 4px; align-items: center; }
.step { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 10px 6px 6px; border-radius: 10px; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); border: 1.5px solid var(--line-2); background: var(--surface); }
.step.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.step[aria-current="step"] { background: var(--accent-soft); color: var(--fg); }
.step[aria-current="step"] .n { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.step:hover { background: var(--surface-3); }
.steps .bar { width: 18px; height: 1.5px; background: var(--line-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; } .btn.ghost:hover { background: var(--surface-3); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.ib { width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 7px; border: 0; background: none; color: var(--fg-2); flex: none; }
.ib:hover { background: var(--surface-3); color: var(--fg); }
.ib.on { color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; background: var(--surface-3); color: var(--fg-2); font-size: 12px; font-weight: 500; border: 0; white-space: nowrap; }
button.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-fg); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ai { background: var(--ok-soft); color: var(--ok); } .chip.offline { background: var(--todo-soft); color: var(--todo); }
.input { height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); padding: 0 9px; width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 7px 9px; resize: vertical; line-height: 1.45; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; }
.field > label { color: var(--fg-2); font-size: 12px; }
.toggle { position: relative; width: 28px; height: 16px; border-radius: 99px; background: var(--line-2); border: 0; padding: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); } .toggle[aria-checked="true"]::after { transform: translateX(12px); }

.main { display: grid; grid-template-columns: 340px minmax(0, 1fr) 360px; min-height: 0; }
.col { min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
.col.left { border-right: 1px solid var(--line); }
.col.right { border-left: 1px solid var(--line); }
.col-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.col-h h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; }
.col-h h2 .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font: 600 13px var(--mono); flex: none; }
.col-h p { margin: 0; color: var(--fg-2); font-size: 12.5px; }
.col-b { flex: 1; overflow: auto; padding: 14px 18px 18px; display: grid; gap: 16px; align-content: start; min-height: 0; }
.col-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.col-f .btn { flex: 1; }
.sec { display: grid; gap: 8px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.hint { font-size: 12px; color: var(--fg-3); }

/* option cards and image tiles */
.opt-card { padding: 10px; display: grid; gap: 10px; }
.opt-card.sel { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line); }
.opt-head { display: flex; align-items: center; gap: 8px; }
.opt-head .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.opt-head input { border: 0; background: none; font-weight: 600; font-size: 14px; padding: 2px 4px; border-radius: 5px; min-width: 0; flex: 1; }
.opt-head input:hover, .opt-head input:focus { background: var(--surface-3); outline: none; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; display: grid; grid-template-rows: auto auto; }
.tile.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile .th { aspect-ratio: 4/3; background: #fff; display: grid; place-items: center; overflow: hidden; }
.tile .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .cap { font-size: 11px; padding: 4px 6px; display: flex; gap: 4px; align-items: center; min-width: 0; }
.tile .cap span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .kind { position: absolute; top: 4px; left: 4px; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(255,255,255,.92); color: #333; padding: 1px 5px; border-radius: 4px; }
.tile .anc { position: absolute; top: 4px; right: 4px; font-size: 9.5px; font-weight: 700; background: var(--accent); color: var(--accent-fg); padding: 1px 5px; border-radius: 4px; }
.tile.add { border-style: dashed; display: grid; place-items: center; color: var(--fg-3); min-height: 80px; text-align: center; font-size: 11.5px; gap: 4px; padding: 8px; }
.tile.add:hover { color: var(--accent); border-color: var(--accent-line); }
.anchors { display: grid; gap: 2px; }
.arow { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.arow:hover { background: var(--surface-2); }
.arow.sel { background: var(--accent-soft); }
.arow .d { width: 8px; height: 8px; border-radius: 50%; }

/* diagram list */
.dlist { display: grid; gap: 2px; }
.drow { display: grid; grid-template-columns: 38px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; }
.drow:hover { background: var(--surface-2); }
.drow.sel { background: var(--accent-soft); }
.drow .id { font: 600 11.5px var(--mono); color: var(--fg-3); }
.drow .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sdots { display: flex; gap: 3px; }
.sdots i { width: 8px; height: 8px; border-radius: 2px; background: var(--line-2); }
.sdots i.s-prog { background: var(--warn); } .sdots i.s-drawn { background: var(--accent); } .sdots i.s-checked { background: var(--ok); }
.brief-box { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); display: grid; gap: 6px; font-size: 12.5px; }
.proposal { padding: 12px; border-radius: 10px; border: 1px solid var(--accent-line); background: var(--accent-soft); display: grid; gap: 8px; font-size: 12.5px; }
.proposal ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* background + overlay lists */
.bglist, .lylist { display: grid; gap: 4px; }
.bgrow, .lyrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.lyrow { grid-template-columns: 14px 1fr auto; cursor: pointer; }
.lyrow.sel, .bgrow.sel { border-color: var(--accent-line); background: var(--accent-soft); }
.lyrow.off .nm, .bgrow.off .nm { opacity: .45; text-decoration: line-through; }
.lyrow .sw, .bgrow .sw { width: 12px; height: 12px; border-radius: 3px; }
.lyrow .nm, .bgrow .nm { font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lyrow .warn { color: var(--warn); font-size: 11px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.promptbox { display: grid; gap: 6px; padding: 10px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow); }
.promptbox textarea { border: 0; resize: none; outline: none; background: none; min-height: 44px; }
.promptbox .row { display: flex; gap: 6px; align-items: center; }
.promptbox.busy { box-shadow: 0 0 0 2px var(--accent-line), var(--shadow); }
.hist { display: grid; gap: 6px; }
.hist .h { padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12px; display: grid; gap: 3px; }
.hist .h .q { font-weight: 500; }
.hist .h .a { color: var(--fg-2); }

/* centre: viewer + node strip */
.centre { display: grid; grid-template-rows: auto minmax(0, 1fr) 168px; min-height: 0; min-width: 0; background: var(--canvas); }
.vbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.vbar .viewing { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.vbar .viewing b { color: var(--fg); }
.otabs { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 2px; gap: 2px; }
.otabs button { border: 0; background: none; border-radius: 7px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; color: var(--fg-2); font-weight: 500; }
.otabs button i { width: 8px; height: 8px; border-radius: 2px; }
.otabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.stage { position: relative; min-height: 0; overflow: hidden; display: grid; place-items: center; padding: 18px; }
.sheet { position: relative; aspect-ratio: 420 / 297; width: min(100%, calc((100vh - 56px - 48px - 168px - 36px) * 1.414)); box-shadow: var(--paper-shadow); background: #fff; }
.sheet svg { cursor: default; }
.sheet.placing svg { cursor: crosshair; }
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--fg); color: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; box-shadow: var(--shadow-pop); z-index: 3; display: flex; gap: 10px; align-items: center; }
.banner.warn { background: #8a5a00; color: #fff; }
.empty { display: grid; gap: 10px; place-items: center; text-align: center; color: var(--fg-2); max-width: 420px; }
.empty b { color: var(--fg); font-size: 15px; }
.strip { border-top: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.strip-h { display: flex; gap: 14px; padding: 7px 14px 0; font-size: 11px; color: var(--fg-3); align-items: center; }
.strip-h span { display: inline-flex; gap: 6px; align-items: center; }
.strip-h i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.nodes { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 8px 14px 12px; }
.node { flex: none; width: 128px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; cursor: pointer; display: grid; grid-template-rows: 4px auto auto; position: relative; }
.node:hover { border-color: var(--line-2); }
.node.sel { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.node.off { opacity: .5; }
.node .band { background: var(--s1); }
.node .th { height: 62px; background: #fff; border-bottom: 1px solid var(--line); overflow: hidden; }
.node .th svg { width: 100%; height: 100%; }
.node .t { padding: 5px 8px 6px; display: grid; gap: 1px; }
.node .t b { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .t span { font-size: 10.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .err { position: absolute; top: 8px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.wire { flex: none; width: 22px; height: 2px; background: var(--line-2); position: relative; }
.wire::after { content: ""; position: absolute; right: -1px; top: -3px; border: 4px solid transparent; border-left-color: var(--line-2); }

/* right: brief and reasoning */
.rsec { display: grid; gap: 8px; }
.rsec h4 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); display: flex; justify-content: space-between; gap: 8px; }
.quote { font-size: 12.5px; line-height: 1.5; padding-left: 10px; border-left: 3px solid var(--line-2); }
.chk { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12.5px; align-items: start; }
.chk .st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; margin-top: 1px; }
.chk .st.pass { background: var(--ok); } .chk .st.warn { background: var(--warn); } .chk .st.fail { background: var(--err); } .chk .st.todo { background: var(--todo); }
.chk .v { font-size: 11.5px; color: var(--fg-2); }
.crit { padding: 8px 10px; border-radius: 8px; background: var(--surface-2); display: grid; gap: 3px; font-size: 12px; }
.crit .ci { font: 600 11px var(--mono); color: var(--fg-3); }
.crit .lk { color: var(--fg-2); }
.think { font-size: 12.5px; line-height: 1.55; padding: 10px 12px; border-radius: 10px; background: var(--ok-soft); display: grid; gap: 6px; }
.think ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.think .by { font-size: 11px; color: var(--fg-3); }
.facts { display: grid; gap: 4px; font-size: 12px; }
.facts div { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
.facts dt { color: var(--fg-3); }
.cov { display: grid; gap: 4px; font-size: 12px; }
.cov .r { display: grid; grid-template-columns: 1fr 70px 34px; gap: 8px; align-items: center; }
.cov .bar { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
.cov .bar i { display: block; height: 100%; background: var(--ok); }

.toasts { position: fixed; left: 50%; bottom: 186px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 9px 12px; box-shadow: var(--shadow-pop); display: flex; gap: 10px; align-items: center; max-width: min(520px, calc(100vw - 32px)); font-size: 12.5px; }
.toast button { border: 0; background: none; color: inherit; text-decoration: underline; padding: 0; }
.menu { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); padding: 4px; display: grid; min-width: 220px; max-height: 60vh; overflow: auto; }
.menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; display: flex; gap: 8px; align-items: center; }
.menu button:hover { background: var(--surface-3); }
.menu .sw { width: 10px; height: 10px; border-radius: 3px; }

@media (max-width: 1280px) { .main { grid-template-columns: 300px minmax(0, 1fr) 300px; } .step .lbl { display: none; } }
@media (max-width: 980px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: 1fr; }

/* ---------- projections ---------- */
function mkAxo(cx = 200, cy = 156, s = .8, q = .56, k = 1.05, ox = 200, oy = 140) {

function crPath(P, closed) {

function crSample(P, steps = 10) {
  const out = [], n = P.length;

/* Tapered flow arrow (brief §2a primitive): spine spline, start/end width, arrowhead, fill or gradient. */
function taper(P, w0, w1, fill, op = 1, hs = 2) {

function gradDef(id, a, b, c1, c2, o1 = 1, o2 = 1) {

function rectPts(b, inset = 0) { return [[b.x + inset, b.y + inset], [b.x + b.w - inset, b.y + inset], [b.x + b.w - inset, b.y + b.d - inset], [b.x + inset, b.y + b.d - inset]]; }

R.section = (o, c) => {
  const v = c.v || 'sun', u = c.uid, gy = 196, sx = x => 26 + (x - SITE.x) * 1.5, H = h => h * 2.6;
  const cutY = SITE.y + SITE.d / 2;
  let defs = `<pattern id="ht${u}" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3" stroke="#111" stroke-width="${pt(.35)}"/></pattern>`;
  let base = `<rect x="0" y="0" width="400" height="280" fill="#fff"/>` + `<rect x="0" y="${gy}" width="400" height="84" fill="url(#ht${u})"/>` + `<rect x="${sx(SITE.x + SITE.w) + 12}" y="${gy}" width="80" height="84" fill="#D3E5EE"/>` + `<line x1="0" y1="${gy}" x2="400" y2="${gy}" stroke="#111" stroke-width="${pt(1.4)}"/>`;
  base += txt(sx(SITE.x + SITE.w) + 52, gy + 10, '-10.00', 5.5, { anchor: 'middle', fill: TOK.ext, weight: 600 });
  let beyond = '', cut = '';
  const sorted = o.b.slice().sort((a, b) => a.x - b.x);
  sorted.forEach(b => {
    const x = sx(b.x), w = b.w * 1.5, h = H(b.h), isCut = b.y <= cutY && b.y + b.d >= cutY;
    if (!isCut) { beyond += `<rect x="${f(x)}" y="${f(gy - h)}" width="${f(w)}" height="${f(h)}" fill="#EFEFEF" stroke="#B5B5B5" stroke-width="${pt(.4)}"/>`; return; }
    cut += `<rect x="${f(x)}" y="${f(gy - h)}" width="${f(w)}" height="${f(h)}" fill="#fff" stroke="#111" stroke-width="${pt(.6)}"/>`;
    for (let z = 0; z <= h + .1; z += 4.2 * 2.6) cut += `<rect x="${f(x)}" y="${f(gy - z - .8)}" width="${f(w)}" height=".9" fill="#111"/>`;
    cut += `<rect x="${f(x)}" y="${f(gy - h)}" width="1.1" height="${f(h)}" fill="#111"/><rect x="${f(x + w - 1.1)}" y="${f(gy - h)}" width="1.1" height="${f(h)}" fill="#111"/>`;
  });
  let ov = '';
  if (v === 'sun' || v === 'eco') {
    ov += `<circle cx="34" cy="30" r="9" fill="${TOK.hi}"/>`;
    sorted.forEach((b, i) => { const x = sx(b.x) + b.w * .75, y = gy - H(b.h); ov += `<line x1="40" y1="34" x2="${f(x)}" y2="${f(y)}" stroke="${TOK.hi}" stroke-width="${pt(1)}" stroke-dasharray="${pt(3)} ${pt(2)}"/>`; });
    if (v === 'sun') ov += bi(56, 26, '夏至 76°', 'Summer solstice', 6, { anchor: 'start' }) + `<path d="M 16 ${gy} A 60 60 0 0 1 76 ${gy - 60}" fill="none" stroke="${TOK.axis}" stroke-width="${pt(.8)}" stroke-dasharray="${pt(2)} ${pt(2)}"/>` + bi(84, gy - 62, '冬至 31°', 'Winter solstice', 6, { anchor: 'start' });
  }
  if (v === 'wind' || v === 'eco') {
    let defs2 = '';
    [[[4, gy - 24], [70, gy - 30], [150, gy - 18], [230, gy - 40], [330, gy - 70]], [[4, gy - 60], [90, gy - 80], [200, gy - 120], [300, gy - 132]], [[4, gy - 8], [100, gy - 10], [190, gy - 6]]].forEach((p, i) => { defs2 += gradDef(`wd${u}${i}`, p[0], p[p.length - 1], TOK.int, TOK.int, .1, .85); ov += taper(p, 2, 5, `url(#wd${u}${i})`, 1, 1.4); });
    defs += defs2;
    if (v === 'wind') ov += bi(10, gy - 90, '夏季主导风向 SE', 'Prevailing summer wind', 6, { anchor: 'start' }) + bi(300, gy - 150, '烟囱效应', 'Stack effect', 6, { anchor: 'start' });
  }
  if (v === 'eco') {
    sorted.forEach(b => { const x = sx(b.x), y = gy - H(b.h); for (let k = 2; k < b.w * 1.5 - 4; k += 5) ov += pg([[x + k, y - .5], [x + k + 3.6, y - 3], [x + k + 4.4, y - 2.2], [x + k + .8, y + .3]], { fill: '#2A3A6B' }); });
    for (let k = 0; k < 6; k++) ov += `<line x1="${120 + k * 30}" y1="10" x2="${116 + k * 30}" y2="34" stroke="${TOK.int}" stroke-width="${pt(.8)}"/>`;
    ov += `<rect x="150" y="${gy + 8}" width="60" height="16" fill="#D3E5EE" stroke="#111" stroke-width="${pt(.6)}"/>` + bi(180, gy + 15, '雨水回收', 'Rainwater tank', 5.5) + bi(26, 60, '光伏屋面', 'PV roofs', 6, { anchor: 'start' });
  }
  if (v === 'people') {
    const r = rng(o.id.charCodeAt(0));
    sorted.forEach(b => { const x = sx(b.x), w = b.w * 1.5, h = H(b.h); for (let z = 0; z < h - 4; z += 4.2 * 2.6) for (let k = 0; k < 3; k++) { const px = x + 4 + r() * (w - 8), py = gy - z - .9; ov += `<circle cx="${f(px)}" cy="${f(py - 3.4)}" r=".7" fill="#111"/><line x1="${f(px)}" y1="${f(py - 2.7)}" x2="${f(px)}" y2="${f(py)}" stroke="#111" stroke-width="${pt(.8)}"/>`; } });
    const cs = [['从滨水广场进入', 'Arrive from the river plaza'], ['穿过市集大厅', 'Through the market hall'], ['坡道上升', 'Up the ramp'], ['屋顶花园', 'Roof garden']];
    cs.forEach((cc, i) => { const x = 40 + i * 84, y = 22 + (i % 2) * 12; ov += `<circle cx="${x}" cy="${y}" r="3.4" fill="${TOK.ext}"/>` + txt(x, y + 1.7, String(i + 1), 7, { anchor: 'middle', fill: '#fff', weight: 700 }) + bi(x + 5.4, y - 1, cc[0], cc[1], 5.5, { anchor: 'start' }); });
    ov += `<path d="${crPath([[20, gy - 2], [90, gy - 4], [150, gy - 30], [220, gy - 70], [280, gy - H(sorted[sorted.length - 1].h) - 2]])}" fill="none" stroke="${TOK.ext}" stroke-width="${pt(2)}" stroke-dasharray="${pt(4)} ${pt(2)}"/>`;
  }
  const lg = { sun: [{ t: 'dash', c: TOK.hi, zh: '日照', en: 'Sun ray' }, { t: 'dash', c: TOK.axis, zh: '太阳高度角', en: 'Sun altitude' }], wind: [{ t: 'taper', c: TOK.int, zh: '气流', en: 'Air flow' }], eco: [{ t: 'fill', c: '#2A3A6B', zh: '光伏', en: 'PV' }, { t: 'taper', c: TOK.int, zh: '自然通风', en: 'Natural ventilation' }, { t: 'line', c: TOK.int, zh: '雨水', en: 'Rainwater', w: .8 }], people: [{ t: 'dash', c: TOK.ext, zh: '叙事路径', en: 'Narrative route' }] }[v];
  lg.push({ t: 'fill', c: '#111', zh: '剖切', en: 'Cut' }, { t: 'fill', c: '#EFEFEF', zh: '远景', en: 'Beyond' });
  return `<defs>${defs}</defs>${G('base/section', base)}${G('section/beyond', beyond)}${G('section/cut', cut)}${G('analysis/overlay', ov)}${legend(lg, 'r', 'b', { title: ['图例', 'Legend'], w: 62 })}`;
};

R.site = (o) => {

  const ctx = contextLayer(P, { fill: '#1C1C1C', water: '#BCD6E3', park: '#CDE2C2' }, 'plan');
  const mass = o.b.map(b => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="${TOK.ext}"/>`).join('');
  const [cx, cy] = [SITE.x + SITE.w / 2, SITE.y + SITE.d / 2];
  const rings = [[110, '5 分钟', '5 min walk'], [190, '10 分钟', '10 min walk']].map(([r, zh, en]) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#555" stroke-width="${pt(.6)}" stroke-dasharray="${pt(3)} ${pt(2)}"/>` + `<rect x="${cx + r * .7 - 1}" y="${cy - r * .7 - 6}" width="30" height="8" fill="#fff"/>` + bi(cx + r * .7 + 14, cy - r * .7 - 2.6, zh, en, 5.5)).join('');
  const metro = [[0, 40], [100, 34], [200, 28], [300, 44], [400, 60]];

  const bd = `<rect x="${SITE.x - 6}" y="${SITE.y - 6}" width="${SITE.w + 12}" height="${SITE.d + 12}" fill="none" stroke="${TOK.ext}" stroke-width="${pt(1.4)}" stroke-dasharray="${pt(6)} ${pt(3)}"/>`;
  return `${ctx}${G('site/rings', rings)}${G('site/transit', tr)}${G('base/massing', mass)}${G('site/boundary', bd)}${scaleBar(12, 252)}${legend([{ t: 'fill', c: TOK.ext, zh: '本项目', en: 'This project' }, { t: 'fill', c: '#1C1C1C', zh: '现状建筑', en: 'Existing' }, { t: 'line', c: '#2F6BD8', zh: '地铁', en: 'Metro', w: 3 }, { t: 'dash', c: '#555', zh: '步行半径', en: 'Walking radius' }], 'r', 'b', { title: ['图例', 'Legend'] })}`;
};

R.evo = (o) => {
  const stages = [{ cx: 72, s: .36 }, { cx: 200, s: .36 }, { cx: 328, s: .36 }];
  let s = '<rect width="400" height="280" fill="#fff"/>';
  const lab = [['体量', 'Site volume'], ['切分', 'Split and lift'], ['塑形', 'Shape and program']];
  stages.forEach((st, i) => {
    const P = mkAxo(st.cx, 150, st.s, .56, 1.05, SITE.x + SITE.w / 2, SITE.y + SITE.d / 2);
    s += pg([[SITE.x, SITE.y], [SITE.x + SITE.w, SITE.y], [SITE.x + SITE.w, SITE.y + SITE.d], [SITE.x, SITE.y + SITE.d]].map(p => P(p[0], p[1], 0)), { fill: '#F3F3F3', stroke: '#999', 'stroke-width': pt(.4) });
    if (i === 0) s += prism(P, { x: SITE.x + 10, y: SITE.y + 10, w: SITE.w - 20, d: SITE.d - 20, h: 30 }, { top: '#fff', side: '#fff', stroke: '#111', sw: pt(.7), shades: [.06, .14, .03, .1] });
    if (i === 1) { const hs = o.b.map(b => b.h); const mx = Math.max(...hs); sortB(P, [{ x: SITE.x + 10, y: SITE.y + 10, w: SITE.w / 2 - 14, d: SITE.d - 20, h: mx * .8 }, { x: SITE.x + SITE.w / 2 + 4, y: SITE.y + 10, w: SITE.w / 2 - 14, d: SITE.d - 20, h: mx * .6 }]).forEach(b => { s += prism(P, b, { top: '#fff', side: '#fff', stroke: '#111', sw: pt(.7), shades: [.06, .14, .03, .1] }); }); }
    if (i === 2) sortB(P, o.b).forEach(b => { s += prism(P, b, { top: PROG[b.p].c, side: PROG[b.p].c, stroke: '#111', sw: pt(.6), shades: [.1, .22, .05, .17] }); });
    s += `<circle cx="${st.cx - 48}" cy="44" r="4" fill="#111"/>` + txt(st.cx - 48, 45.9, '0' + (i + 1), 6.5, { anchor: 'middle', fill: '#fff', weight: 700 }) + bi(st.cx - 42, 43, lab[i][0], lab[i][1], 6.5, { anchor: 'start' });
    if (i < 2) s += taper([[st.cx + 44, 150], [st.cx + 64, 150]], 3, 2.2, '#9A9A9A', 1, 1.4);
  });
  return G('massing/stages', s) + legend(Object.values(PROG).map(p => ({ t: 'fill', c: p.c, zh: p.zh, en: p.en })), 'r', 'b', { title: ['功能', 'Program'] });
};

R.gradient = (o, c) => {
  const P = PROJ.plan, u = c.uid, e = o.route[0];
  const ctx = contextLayer(P, { fill: '#E3E3E3', water: '#E4EEF2', park: '#E9F1E4' }, 'plan');
  const maxD = 260;
  const mass = o.b.map(b => { const [cx, cy] = ctr(b), t = Math.min(1, Math.hypot(cx - e[0], cy - e[1]) / maxD); return `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="${mix(TOK.axis, TOK.int, t)}" fill-opacity=".85" stroke="#111" stroke-width="${pt(1)}"/>` + bi(cx, cy - 1, t < .5 ? '公共' : '私密', (t < .5 ? 'Public ' : 'Private ') + Math.round((1 - t) * 100) + '%', 5.5); }).join('');
  const field = `<defs><radialGradient id="rf${u}" cx="${e[0]}" cy="${e[1]}" r="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${TOK.axis}" stop-opacity=".35"/><stop offset="1" stop-color="${TOK.axis}" stop-opacity="0"/></radialGradient><linearGradient id="gb${u}"><stop offset="0" stop-color="${TOK.axis}"/><stop offset="1" stop-color="${TOK.int}"/></linearGradient></defs><rect width="400" height="280" fill="url(#rf${u})"/>`;
  const bar = `<rect x="12" y="246" width="70" height="4" fill="url(#gb${u})"/>` + bi(12, 256, '公共', 'Public', 5.5, { anchor: 'start' }) + bi(82, 256, '私密', 'Private', 5.5, { anchor: 'end' });
  return `${ctx}${G('analysis/public-field', field)}${G('program/gradient-zones', mass)}${G('labels/gradient-bar', bar)}${G('circulation/entrance', `<circle cx="${e[0]}" cy="${e[1]}" r="2.6" fill="#111"/>` + bi(e[0] + 4, e[1] + 1, '主入口', 'Main entrance', 5.5, { anchor: 'start' }))}`;
};

R.structure = (o) => {
  const P = PROJ.plan;
  const ctx = contextLayer(P, { fill: '#EDEDED', water: '#EEF4F6', park: '#F0F5EC' }, 'plan');
  let grid = '', cols = '', cores = '';
  const sp = 16.8, xs = [], ys = [];
  for (let x = SITE.x; x <= SITE.x + SITE.w + .1; x += sp) xs.push(x);
  for (let y = SITE.y; y <= SITE.y + SITE.d + .1; y += sp) ys.push(y);
  xs.forEach((x, i) => { grid += `<line x1="${f(x)}" y1="${SITE.y - 10}" x2="${f(x)}" y2="${SITE.y + SITE.d + 4}" stroke="#888" stroke-width="${pt(.3)}" stroke-dasharray="${pt(6)} ${pt(1.5)} ${pt(1)} ${pt(1.5)}"/><circle cx="${f(x)}" cy="${SITE.y - 13}" r="2.6" fill="#fff" stroke="#111" stroke-width="${pt(.5)}"/>` + txt(x, SITE.y - 11.8, String.fromCharCode(65 + i), 5, { anchor: 'middle', weight: 600 }); });
  ys.forEach((y, i) => { grid += `<line x1="${SITE.x - 10}" y1="${f(y)}" x2="${SITE.x + SITE.w + 4}" y2="${f(y)}" stroke="#888" stroke-width="${pt(.3)}" stroke-dasharray="${pt(6)} ${pt(1.5)} ${pt(1)} ${pt(1.5)}"/><circle cx="${SITE.x - 13}" cy="${f(y)}" r="2.6" fill="#fff" stroke="#111" stroke-width="${pt(.5)}"/>` + txt(SITE.x - 13, y + 1.2, String(i + 1), 5, { anchor: 'middle', weight: 600 }); });
  const mass = o.b.map(b => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="#fff" stroke="#111" stroke-width="${pt(.8)}"/>`).join('');
  o.b.forEach(b => {
    xs.forEach(x => ys.forEach(y => { if (x > b.x + 1 && x < b.x + b.w - 1 && y > b.y + 1 && y < b.y + b.d - 1) cols += `<rect x="${f(x - .8)}" y="${f(y - .8)}" width="1.6" height="1.6" fill="#111"/>`; }));
    const [cx, cy] = ctr(b); cores += `<rect x="${f(cx - 4)}" y="${f(cy - 5)}" width="8" height="10" fill="#111"/><line x1="${f(cx - 4)}" y1="${f(cy - 5)}" x2="${f(cx + 4)}" y2="${f(cy + 5)}" stroke="#fff" stroke-width="${pt(.4)}"/>`;
  });
  return `${ctx}${G('structure/grid', grid)}${G('base/massing', mass)}${G('structure/columns', cols)}${G('structure/cores', cores)}${scaleBar(12, 252)}${legend([{ t: 'fill', c: '#111', zh: '核心筒', en: 'Core' }, { t: 'dot', c: '#111', zh: '柱 16.8 m 柱网', en: 'Column, 16.8 m grid' }, { t: 'dash', c: '#888', zh: '轴网', en: 'Grid line' }], 'r', 'b', { title: ['图例', 'Legend'], w: 66 })}`;
};

R.landscape = (o, c) => {
  const P = PROJ.plan, u = c.uid, r = rng(o.id.charCodeAt(0) * 7);
  const ctx = contextLayer(P, { fill: '#E4E4E4', water: TOK.water, park: '#D2E6C4' }, 'plan');
  let defs = `<radialGradient id="lf${u}"><stop offset="0" stop-color="#E3F0D6"/><stop offset="1" stop-color="#B9D9A0"/></radialGradient>`;
  const inB = (x, y, m = 2) => o.b.some(b => x > b.x - m && x < b.x + b.w + m && y > b.y - m && y < b.y + b.d + m);
  let land = `<rect x="${SITE.x}" y="${SITE.y}" width="${SITE.w}" height="${SITE.d}" fill="url(#lf${u})"/>`;
  let trees = '';
  for (let i = 0; i < 90; i++) { const x = SITE.x + r() * SITE.w, y = SITE.y + r() * (SITE.d + 30), rr = 1.6 + r() * 2.6; if (inB(x, y, rr + 1) || y > 234) continue; trees += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(rr)}" fill="#7DB563" fill-opacity=".8" stroke="#4E8A3A" stroke-width="${pt(.4)}"/>`; }
  const mass = o.b.map(b => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="#fff" stroke="#111" stroke-width="${pt(.8)}"/>`).join('');
  let cor = '';
  [[[60, 130], [96, 134], [124, 136]], [[220, 232], [218, 222], [216, 212]], [[86, 168], [100, 196], [112, 210]]].forEach((p, i) => { defs += gradDef(`lc${u}${i}`, p[0], p[2], TOK.green, TOK.green, .2, .9); cor += taper(p, 10, 4, `url(#lc${u}${i})`, 1, 1.6); });
  return `<defs>${defs}</defs>${ctx}${G('landscape/fills', land)}${G('landscape/trees', trees)}${G('base/massing', mass)}${G('landscape/green-corridors', cor)}${scaleBar(12, 252)}${legend([{ t: 'fill', c: '#B9D9A0', zh: '景观绿地', en: 'Landscape' }, { t: 'circle', c: '#4E8A3A', zh: '乔木', en: 'Trees' }, { t: 'taper', c: TOK.green, zh: '绿化廊道', en: 'Green corridor' }], 'r', 'b', { title: ['图例', 'Legend'] })}`;
};

R.exploded = (o) => {
  const big = o.b.reduce((a, b) => (b.w * b.d * b.h > a.w * a.d * a.h ? b : a));
  const [cx, cy] = ctr(big);
  // Fit the slab to roughly 150 mm of sheet width whatever the footprint (Option B's 190 m slab overflowed at a fixed 1.5).
  const P = mkAxo(190, 214, Math.min(1.5, 118 / Math.max(big.w, big.d)), .56, 1.05, cx, cy);
  const n = Math.max(3, Math.min(5, Math.round(big.h / 8))), gap = 15;
  const cols = [PROG.market.c, PROG.culture.c, PROG.learning.c, PROG.community.c, PROG.culture.c];
  let s = '<rect width="400" height="280" fill="#fff"/>';
  s += pg(rectPts(big).map(q => P(q[0], q[1], 0)), { fill: 'none', stroke: '#888', 'stroke-width': pt(.5), 'stroke-dasharray': `${pt(3)} ${pt(2)}` });
  rectPts(big).forEach(q => { const a = P(q[0], q[1], 0), b = P(q[0], q[1], (n - 1) * gap + 2); s += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#999" stroke-width="${pt(.4)}" stroke-dasharray="${pt(2)} ${pt(2)}"/>`; });
  let tags = '';
  for (let i = 0; i < n; i++) {
    const z = i * gap;
    s += prism(P, { x: big.x, y: big.y, w: big.w, d: big.d, h: 1.6, z }, { top: cols[i], side: cols[i], stroke: '#111', sw: pt(.6), shades: [.15, .3, .1, .25] });
    const m1 = P(big.x + big.w * .45, big.y, z + 1.6), m2 = P(big.x + big.w * .45, big.y + big.d, z + 1.6), m3 = P(big.x, big.y + big.d * .5, z + 1.6), m4 = P(big.x + big.w * .45, big.y + big.d * .5, z + 1.6);
    s += `<line x1="${f(m1[0])}" y1="${f(m1[1])}" x2="${f(m2[0])}" y2="${f(m2[1])}" stroke="#111" stroke-width="${pt(.5)}"/><line x1="${f(m3[0])}" y1="${f(m3[1])}" x2="${f(m4[0])}" y2="${f(m4[1])}" stroke="#111" stroke-width="${pt(.5)}"/>`;
    const a = P(big.x + big.w, big.y + big.d * .5, z + .8);
    tags += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(a[0] + 40)}" y2="${f(a[1])}" stroke="#111" stroke-width="${pt(.5)}" stroke-dasharray="${pt(1.5)} ${pt(1)}"/>` + txt(a[0] + 42, a[1] + 1.4, 'F0' + (i + 1), 6, { weight: 700 }) + bi(a[0] + 54, a[1] + .2, ['市集', '展厅', '阅览', '工作坊', '屋顶花园'][i], ['Market', 'Gallery', 'Reading room', 'Workshops', 'Roof garden'][i], 5.2, { anchor: 'start', inline: true });
  }
  return G('axo/exploded-floors', s) + G('labels/floor-tags', tags) + legend(Object.values(PROG).map(p => ({ t: 'fill', c: p.c, zh: p.zh, en: p.en })), 'r', 'b', { title: ['功能', 'Program'] });
};

/* Full sheet: A3 frame + bilingual title block + content in site metres. */
function diagram(t, o, ctx = {}) {
  const u = ++UID;
  const c = Object.assign({ uid: u, v: t.v }, ctx);
  const inner = R[t.r](o, c);
  const title = `<text class="dg dg-zh" x="10" y="12.6" font-size="${pt(TOK.title)}" font-weight="600">${esc(t.zh)} · 方案${o.id}</text>` +
    `<text class="dg" x="410" y="12.6" font-size="${pt(TOK.title)}" font-weight="600" text-anchor="end">${esc(t.en)} · Option ${o.id}</text>` +
    `<line x1="10" y1="288" x2="410" y2="288" stroke="#111" stroke-width="${pt(.5)}"/>` +
    `<text class="dg" x="10" y="293.4" font-size="${pt(5.5)}"><tspan class="dg-zh">滨水文化街区</tspan> Riverside Cultural Quarter · ${esc(o.name)}</text>` +
    `<text class="dg" x="410" y="293.4" font-size="${pt(5.5)}" text-anchor="end">RCQ-${o.id}-${t.n} · ${t.r === 'section' ? '1:650' : '1:1000'} @ A3</text>`;
  return `<svg class="dg-svg" viewBox="0 0 420 297" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(t.en)}, Option ${o.id}">` +
    `<rect width="420" height="297" fill="#fff"/><defs><clipPath id="cl${u}"><rect width="400" height="266"/></clipPath></defs>` +
    `<g data-k="frame/title">${title}</g>` +
    `<g class="dg-content" transform="translate(10,19)" clip-path="url(#cl${u})">${inner}</g>` +
    (ctx.editor ? `<g id="edOverlay" transform="translate(10,19)"></g>` : '') + `</svg>`;
}

/* Small plan drawings for asset cards on the board (stand-ins for the imported PDF pages). */
function assetPlan(o, kind) {
  let s = `<svg viewBox="96 46 250 180" xmlns="http://www.w3.org/2000/svg"><rect x="96" y="46" width="250" height="180" fill="#fff"/>`;
  if (kind === 'axo') {
    const P = mkAxo(221, 150, .6, .56, 1.05, 221, 136);
    s += sortB(P, o.b).map(b => prism(P, b, { top: '#fff', side: '#fff', stroke: '#222', sw: .5, shades: [.05, .12, .02, .09] })).join('');
  } else {
    s += `<rect x="${SITE.x}" y="${SITE.y}" width="${SITE.w}" height="${SITE.d}" fill="none" stroke="#bbb" stroke-width=".5" stroke-dasharray="3 2"/>`;
    o.b.forEach(b => {
      s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="none" stroke="#111" stroke-width="1.6"/>`;
      if (kind !== 'site') for (let x = b.x + 12; x < b.x + b.w - 4; x += 14) s += `<line x1="${x}" y1="${b.y}" x2="${x}" y2="${b.y + b.d}" stroke="#555" stroke-width=".4"/>`;
      if (kind !== 'site') s += `<line x1="${b.x}" y1="${b.y + b.d * .45}" x2="${b.x + b.w}" y2="${b.y + b.d * .45}" stroke="#555" stroke-width=".4"/>`;
    });
  }
  return s + '</svg>';
}

  const blob = await (await fetch(url)).blob();
  return dataUrlCache[url] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
}
/* Rasterise the background group alone, at 300 ppi of its printed size. */
async function rasterBackground(svgDoc, ppi = 300) {
  const content = svgDoc.querySelector('.dg-content'), bg = content && content.querySelector('[data-k="background"]');
  if (!bg) return null;
  for (const im of bg.querySelectorAll('image')) {
    const href = im.getAttribute('href') || im.getAttribute('xlink:href') || '';
    if (href && !href.startsWith('data:')) im.setAttribute('href', await toDataUrl(href));
  }
  const defs = [...svgDoc.querySelectorAll('defs')].map(x => new XMLSerializer().serializeToString(x)).join('');
  const W = Math.round(400 / 25.4 * ppi), H = Math.round(266 / 25.4 * ppi);
  const src = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 400 266">${defs}${new XMLSerializer().serializeToString(bg)}</svg>`;
  const url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' }));
  try {
    const img = new Image(); img.decoding = 'sync';
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('background did not decode')); img.src = url; });
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .9));
    return { bytes: new Uint8Array(await blob.arrayBuffer()), W, H, ppi };
  } finally { URL.revokeObjectURL(url); }
}

async function pdfPage(svgString, gs, gsName, usedCJK) {
  const doc = new DOMParser().parseFromString(svgString, 'image/svg+xml');
  const root = doc.documentElement;
  const layers = []; // {name, ops}
  const raster = await rasterBackground(doc).catch(e => ({ error: e.message }));
  const report = { layers: [], raster: raster && !raster.error ? `${raster.W} × ${raster.H} px · ${raster.ppi} ppi` : (raster && raster.error) || 'none' };

  function emit(el, M, opacity, out) {
    if (el.nodeType !== 1) return;
    const tag = el.tagName;
    if (tag === 'defs' || tag === 'clipPath' || tag === 'linearGradient' || tag === 'radialGradient' || tag === 'filter' || tag === 'title') return;
    if (el.getAttribute('display') === 'none') return;
    const M2 = mul(M, parseTransform(el.getAttribute('transform')));
    const op = opacity * +(el.getAttribute('opacity') ?? 1);
    if (tag === 'g' || tag === 'svg') { for (const c of el.childNodes) emit(c, M2, op, out); return; }
    const fill = parseColor(el.getAttribute('fill') ?? (tag === 'text' ? '#111' : (tag === 'line' || tag === 'polyline') ? 'none' : '#000'), doc);
    const stroke = parseColor(el.getAttribute('stroke'), doc);
    const fo = op * +(el.getAttribute('fill-opacity') ?? 1) * (fill ? fill.op : 1), so = op * +(el.getAttribute('stroke-opacity') ?? 1) * (stroke ? stroke.op : 1);
    let o = `q ${M2.map(n).join(' ')} cm /${gsName(fo, so)} gs `;
    if (tag === 'text') {
      if (!fill) return;
      const size = +el.getAttribute('font-size') || 2, anchor = el.getAttribute('text-anchor') || 'start', boldP = +(el.getAttribute('font-weight') || 400) >= 600;
      const lines = []; let line = { x: +el.getAttribute('x') || 0, y: +el.getAttribute('y') || 0, runs: [] }; lines.push(line);
      for (const c of el.childNodes) {
        if (c.nodeType === 3) { if (c.textContent) line.runs.push({ s: c.textContent, size, bold: boldP }); continue; }
        if (c.tagName !== 'tspan') continue;
        if (c.hasAttribute('x')) { line = { x: +c.getAttribute('x'), y: line.y + (+c.getAttribute('dy') || 0), runs: [] }; lines.push(line); }
        line.runs.push({ s: c.textContent, size: +c.getAttribute('font-size') || size, bold: c.hasAttribute('font-weight') ? +c.getAttribute('font-weight') >= 600 : boldP });
      }
      o += `${fill.rgb.map(n).join(' ')} rg `;
      lines.forEach(L => {
        const w = L.runs.reduce((a, r) => a + textWidth(r.s, r.size, r.bold), 0);
        let x = L.x - (anchor === 'middle' ? w / 2 : anchor === 'end' ? w : 0);
        L.runs.forEach(r => {
          let seg = '', cj = null;
          const flush = () => { if (!seg) return; if (cj) usedCJK.v = true; o += `BT /${cj ? 'F3' : r.bold ? 'F2' : 'F1'} ${n(r.size)} Tf 1 0 0 -1 ${n(x)} ${n(L.y)} Tm ${cj ? cjkHex(seg) : latin(seg)} Tj ET `; x += textWidth(seg, r.size, r.bold); seg = ''; };
          for (const ch of r.s) { const k = isCJK(ch); if (cj !== null && k !== cj) flush(); cj = k; seg += ch; }
          flush();
        });
      });
      out.push(o + 'Q'); return;
    }
    let p = '';
    const a = k => +el.getAttribute(k) || 0;
    if (tag === 'rect') p = `${n(a('x'))} ${n(a('y'))} ${n(a('width'))} ${n(a('height'))} re `;
    else if (tag === 'circle') p = ellipseOps(a('cx'), a('cy'), a('r'), a('r'));
    else if (tag === 'ellipse') p = ellipseOps(a('cx'), a('cy'), a('rx'), a('ry'));
    else if (tag === 'line') p = `${n(a('x1'))} ${n(a('y1'))} m ${n(a('x2'))} ${n(a('y2'))} l `;
    else if (tag === 'polyline' || tag === 'polygon') { const v = (el.getAttribute('points') || '').trim().split(/[\s,]+/).map(parseFloat); for (let i = 0; i + 1 < v.length; i += 2) p += `${n(v[i])} ${n(v[i + 1])} ${i ? 'l' : 'm'} `; if (tag === 'polygon') p += 'h '; }
    else if (tag === 'path') p = pathOps(el.getAttribute('d') || '');
    else return;
    if (fill) o += `${fill.rgb.map(n).join(' ')} rg `;
    if (stroke) {
      o += `${stroke.rgb.map(n).join(' ')} RG ${n(+el.getAttribute('stroke-width') || 1)} w `;
      if (el.getAttribute('stroke-linecap') === 'round') o += '1 J ';
      if (el.getAttribute('stroke-linejoin') === 'round') o += '1 j ';
      const da = el.getAttribute('stroke-dasharray'); if (da && da !== 'none') o += `[${da.split(/[\s,]+/).map(parseFloat).map(n).join(' ')}] 0 d `;
    }
    o += p + (fill && stroke ? 'B' : fill ? 'f' : stroke ? 'S' : 'n') + ' Q';
    out.push(o);
  }

  const content = root.querySelector('.dg-content');
  const CM = parseTransform(content.getAttribute('transform'));
  const clipRect = content.querySelector('clipPath rect') || doc.querySelector('clipPath rect');
  const clip = `${n(CM[4])} ${n(CM[5])} ${n(+clipRect.getAttribute('width'))} ${n(+clipRect.getAttribute('height'))} re W n `;
  if (raster && !raster.error) { layers.push({ name: 'background (raster)', ops: [`q 400 0 0 -266 ${n(CM[4])} ${n(CM[5] + 266)} cm /Im0 Do Q`] }); report.layers.push({ name: 'background', kind: 'raster' }); }
  for (const g of content.children) {
    if (g.getAttribute('data-k') === 'background' || g.tagName === 'defs') continue;
    const out = []; emit(g, CM, 1, out);
    layers.push({ name: g.getAttribute('data-name') ? `${g.getAttribute('data-name')}` : g.getAttribute('data-k'), ops: out, clip: true });
    report.layers.push({ name: g.getAttribute('data-name') || g.getAttribute('data-k'), kind: 'vector' });
  }
  const frame = root.querySelector('[data-k="sheet/title"]');
  if (frame) { const out = []; emit(frame, [1, 0, 0, 1, 0, 0], 1, out); layers.push({ name: 'sheet frame', ops: out }); report.layers.push({ name: 'sheet frame', kind: 'text' }); }

  return { layers, raster: raster && !raster.error ? raster : null, clip, report };
}

/* Many sheets → one PDF. Layers with the same name share one OCG, so "Retail loop" toggles on every page at once. */
async function sheetsToPdf(svgStrings, meta = {}) {
  const gs = new Map(); const gsName = (ca, CA) => { const k = n(ca) + '/' + n(CA); if (!gs.has(k)) gs.set(k, { name: 'GS' + gs.size, ca, CA }); return gs.get(k).name; };
  const pages = []; const usedCJK = { v: false }; for (const s of svgStrings) pages.push(await pdfPage(s, gs, gsName, usedCJK));
  const PW = 420 * MM, PH = 297 * MM;
  const parts = []; const offs = []; let len = 0;
  function latin1(s) { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; return b; }
  const push = x => { const b = typeof x === 'string' ? latin1(x) : x; parts.push(b); len += b.length; };
  const obj = (id, body) => { offs[id] = len; push(`${id} 0 obj\n`); if (Array.isArray(body)) body.forEach(push); else push(body); push('\nendobj\n'); };
  // fixed ids: 1 catalog, 2 pages, 3-5 fonts F1 F2 F3, 6 CID font, 7 descriptor, 8 info
  let next = 9;
  const ocgByName = new Map(); pages.forEach(pg => pg.layers.forEach(L => { if (!ocgByName.has(L.name)) ocgByName.set(L.name, next++); }));
  const pageIds = pages.map(pg => ({ page: next++, content: next++, img: pg.raster ? next++ : 0 }));
  const ocgs = [...ocgByName.values()].map(x => x + ' 0 R').join(' ');
  push('%PDF-1.6\n%\xE2\xE3\xCF\xD3\n');
  obj(1, `<< /Type /Catalog /Pages 2 0 R /OCProperties << /OCGs [${ocgs}] /D << /Name (Layers) /Order [${ocgs}] /ON [${ocgs}] >> >> >>`);
  obj(2, `<< /Type /Pages /Kids [${pageIds.map(p => p.page + ' 0 R').join(' ')}] /Count ${pages.length} >>`);
  obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  obj(5, '<< /Type /Font /Subtype /Type0 /BaseFont /STSong-Light /Encoding /UniGB-UCS2-H /DescendantFonts [6 0 R] >>');
  obj(6, '<< /Type /Font /Subtype /CIDFontType0 /BaseFont /STSong-Light /CIDSystemInfo << /Registry (Adobe) /Ordering (GB1) /Supplement 2 >> /FontDescriptor 7 0 R /DW 1000 >>');
  obj(7, '<< /Type /FontDescriptor /FontName /STSong-Light /Flags 6 /FontBBox [-25 -254 1000 880] /ItalicAngle 0 /Ascent 880 /Descent -120 /CapHeight 880 /StemV 93 >>');
  obj(8, `<< /Title ${latin(meta.title || 'DiagramLab diagrams')} /Creator (DiagramLab Flow prototype) /Producer (DiagramLab hand-written PDF writer) >>`);
  ocgByName.forEach((id, name) => obj(id, `<< /Type /OCG /Name ${latin(name)} >>`));
  const gsDict = [...gs.values()].map(g => `/${g.name} << /Type /ExtGState /ca ${n(g.ca)} /CA ${n(g.CA)} >>`).join(' ');
  pages.forEach((pg, pi) => {
    const ids = pageIds[pi];
    let stream = `${n(MM)} 0 0 ${n(-MM)} 0 ${n(PH)} cm 1 1 1 rg 0 0 420 297 re f `;
    const props = [];
    pg.layers.forEach((L, i) => { const oc = ocgByName.get(L.name); props.push(`/L${oc} ${oc} 0 R`); stream += `/OC /L${oc} BDC q ${L.clip ? pg.clip : ''}${L.ops.join('\n')} Q EMC\n`; });
    const sb = latin1(stream);
    obj(ids.page, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${n(PW)} ${n(PH)}] /TrimBox [0 0 ${n(PW)} ${n(PH)}] /Contents ${ids.content} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R${usedCJK.v ? ' /F3 5 0 R' : ''} >> /ExtGState << ${gsDict} >> /Properties << ${[...new Set(props)].join(' ')} >>${ids.img ? ` /XObject << /Im0 ${ids.img} 0 R >>` : ''} >> >>`);
    obj(ids.content, [`<< /Length ${sb.length} >>\nstream\n`, sb, '\nendstream']);
    if (ids.img) obj(ids.img, [`<< /Type /XObject /Subtype /Image /Width ${pg.raster.W} /Height ${pg.raster.H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.raster.bytes.length} >>\nstream\n`, pg.raster.bytes, '\nendstream']);
  });
  const xref = len;
  let x = `xref\n0 ${next}\n0000000000 65535 f \n`;
  for (let i = 1; i < next; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${next} /Root 1 0 R /Info 8 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(len); let p = 0; parts.forEach(b => { out.set(b, p); p += b.length; });
  return { bytes: out, reports: pages.map(pg => pg.report), size: len };
}

/* SVG export: the same sheet, with each layer as a named top-level group (Illustrator and Inkscape read these as layers). */
function sheetToSvg(svgString) {
  const doc = new DOMParser().parseFromString(svgString, 'image/svg+xml');
  const root = doc.documentElement;
  root.setAttribute('xmlns:inkscape', 'http://www.inkscape.org/namespaces/inkscape');
  root.setAttribute('width', '420mm'); root.setAttribute('height', '297mm');
  root.querySelectorAll('.vw-handles').forEach(x => x.remove());
  root.querySelectorAll('[data-layer]').forEach(g => {
    const name = g.getAttribute('data-name') || g.getAttribute('data-k');
    g.setAttribute('id', name.replace(/[^\w-]+/g, '_')); g.setAttribute('inkscape:groupmode', 'layer'); g.setAttribute('inkscape:label', name);
  });
  const style = doc.createElementNS('http://www.w3.org/2000/svg', 'style');
  style.textContent = '.dg{font-family:Helvetica,Arial,"PingFang SC","Noto Sans CJK SC",sans-serif}.dg-zh{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}';
  root.insertBefore(style, root.firstChild);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(root);
}

/* Minimal .xlsx reader: zip central directory → inflate (DecompressionStream) → sharedStrings + sheets.
   Enough to re-import the RMUH tracker after it changes; it reads the same two tabs the build step embedded. */
async function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf); let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Not a zip file');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const files = {};
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    const lnl = dv.getUint16(off + 26, true), lel = dv.getUint16(off + 28, true), data = u8.subarray(off + 30 + lnl + lel, off + 30 + lnl + lel + csize);
    files[name] = { method, data }; p += 46 + nl + el + cl;
  }
  return async name => {
    const f = files[name]; if (!f) return null;
    if (f.method === 0) return new TextDecoder().decode(f.data);
    const ds = new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(ds).text();
  };
}
async function readXlsx(buf) {
  const get = await readZip(buf);
  const P = s => new DOMParser().parseFromString(s, 'application/xml');
  const ss = []; const sst = await get('xl/sharedStrings.xml');
  if (sst) P(sst).querySelectorAll('si').forEach(si => ss.push([...si.querySelectorAll('t')].map(t => t.textContent).join('')));
  const wb = P(await get('xl/workbook.xml')), rels = P(await get('xl/_rels/workbook.xml.rels'));
  const sheets = {};
  for (const s of wb.querySelectorAll('sheet')) {
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    const rel = [...rels.querySelectorAll('Relationship')].find(r => r.getAttribute('Id') === rid);
    const xml = await get('xl/' + rel.getAttribute('Target').replace(/^\/?xl\//, ''));
    sheets[s.getAttribute('name')] = [...P(xml).querySelectorAll('row')].map(r => { const o = {}; r.querySelectorAll('c').forEach(c => { const ref = c.getAttribute('r').replace(/\d+/g, ''), v = c.querySelector('v'), is = c.querySelector('is'); o[ref] = c.getAttribute('t') === 's' && v ? ss[+v.textContent] : v ? v.textContent : is ? is.textContent : ''; }); return o; });
  }
  return sheets;
}
/* Map the tracker's two tabs into the app's shape. Column letters follow D1_RMUH_Diagrams.xlsx. */
function xlFromSheets(sheets) {
  const D = sheets.Diagrams || Object.values(sheets)[0], C = sheets.Criteria || Object.values(sheets)[1] || [];
  const head = D.find(r => r.A === 'ID') || {};
  const opts = ['G', 'H', 'I', 'J'].map(c => head[c]).filter(Boolean);
  const diagrams = D.filter(r => /^D\d\d/.test(r.A || '')).map(r => ({ id: r.A, name: r.B || '', show: r.C || '', succeeds: r.D || '', notes: r.L || '', status: Object.fromEntries(opts.map((o, i) => [o, r['GHIJ'[i]] || 'Not started'])) }));
  const criteria = C.filter(r => /^C\d\.\d\d/.test(r.A || '')).map(r => ({ id: r.A, domain: r.B || '', name: r.C || '', question: r.D || '', proof: (r.E || '').split(',').map(x => x.trim()).filter(Boolean), look: r.F || '' }));
  return { options: opts.length ? opts : XL_DEFAULT.options, diagrams, criteria };
}

/* ---------- diagrams from recipes ---------- */
function mkLayer(type, extra = {}) { const T = LTYPES[type]; return Object.assign({ id: uid('L'), type, name: T.name, on: true, color: T.color, width: T.width, dash: !!T.dash, dx: 0, dy: 0 }, extra); }
function mkBg(kind, prompt) { return { id: uid('B'), kind, label: BG_KINDS[kind].label, prompt: prompt || '', on: true }; }

function applyOps(d, ops, label) {

      } else {
        const L = findL(op.layer); if (!L) continue;
        if (op.op === 'style') { if (op.color) L.color = op.color; if (op.width) L.width = +op.width; if (op.dash != null) L.dash = !!op.dash; done.push(`Restyled ${L.name}`); }
        if (op.op === 'move') { L.dx = (L.dx || 0) + (+op.dx || 0); L.dy = (L.dy || 0) + (+op.dy || 0); done.push(`Moved ${L.name}`); }
        if (op.op === 'hide') { L.on = false; done.push(`Hid ${L.name}`); }
        if (op.op === 'show') { L.on = true; done.push(`Showed ${L.name}`); }
        if (op.op === 'remove') { d.layers = d.layers.filter(x => x !== L); done.push(`Removed ${L.name}`); }
        if (op.op === 'text' && op.text) { L.text = op.text; done.push(`Changed text of ${L.name}`); }
      }
    } catch (e) { done.push(`Skipped one step: ${e.message}`); }
  }

}

function promptBox(scope, ph) { return `<form class="promptbox" id="pf-${scope}"><textarea id="pt-${scope}" rows="2" placeholder="${esc(ph)}" aria-label="Prompt"></textarea><div class="row"><span class="faint" style="font-size:11.5px;flex:1">${AI ? 'Claude reads the brief, the Excel row and the layers' : 'Built-in parser (Claude not reachable here)'}</span><button class="btn primary sm" type="submit">${ic('send')}Apply</button></div></form>`; }
function histHtml(d, scope) { const h = d.prompts.filter(p => p.scope === scope).slice(-6).reverse(); return h.length ? `<div class="sec"><span class="eyebrow">Prompt history</span><div class="hist">${h.map(p => `<div class="h"><span class="q">“${esc(p.q)}”</span><span class="a">${esc(p.a)}</span><span class="faint" style="font-size:11px">${esc(p.by)} · ${p.done.map(esc).join(' · ') || 'no change'}</span></div>`).join('')}</div></div>` : ''; }
function wirePrompt(scope) {
  const f = $('#pf-' + scope), t = $('#pt-' + scope);
  t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
  f.onsubmit = async e => {
    e.preventDefault(); const q = t.value.trim(); if (!q) return; const d = cur();
    f.classList.add('busy'); t.disabled = true;
    let res, by = AI ? 'Claude' : 'built-in parser';
    try { res = await promptOps(q, scope); } catch (err) { res = parsePrompt(q, scope); by = 'built-in parser (Claude: ' + (err.code || 'error') + ')'; }
    const done = applyOps(d, res.ops || [], q);
    d.prompts.push({ q, a: res.reply || '', by, done, scope });
    if (scope === 'bg') ST.node = d.bg.length; else if (ST.layerSel) ST.node = 1 + d.bg.length + d.layers.findIndex(x => x.id === ST.layerSel);
    save(); renderAll(); toast(done.length ? done.map(esc).join(' · ') : 'Nothing changed. ' + esc(res.reply || ''), done.length ? ['Undo', undo] : null);
  };
}
function openMenu(anchor, items, onPick) {
  const m = document.createElement('div'); m.className = 'menu'; m.innerHTML = items.map(([k, n, c]) => `<button data-k="${k}"><span class="sw" style="background:${c}"></span>${esc(n)}</button>`).join('');
  document.body.appendChild(m); const r = anchor.getBoundingClientRect(); m.style.left = Math.min(r.left, innerWidth - 240) + 'px'; m.style.top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 8) + 'px';
  const close = ev => { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('pointerdown', close); } };
  setTimeout(() => document.addEventListener('pointerdown', close), 0);
  $$('button', m).forEach(b => b.onclick = () => { m.remove(); document.removeEventListener('pointerdown', close); onPick(b.dataset.k); });
}
